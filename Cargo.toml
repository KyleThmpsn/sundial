[package]
name = "sundial"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autobins = false
# Diagnostic examples are local, ignored files rather than build targets.
autoexamples = false
build = false
license.workspace = true
description = "A local Project Sunrise character and loadout settings editor"
repository = "https://github.com/kylethmpsn/sundial"
readme = "README.md"
publish = false

[workspace]
members = [
    "crates/sundial-account",
    "crates/sundial-suite",
    "crates/parhelion",
    "crates/parhelion-import",
]
default-members = [
    ".",
    "crates/sundial-account",
    "crates/sundial-suite",
    "crates/parhelion",
]
resolver = "2"

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.lints.clippy]
# Package readers take byte slices from fixed-stride records; the as_chunks form would change
# their element type to arrays at every site for no behavioural gain.
chunks_exact_to_as_chunks = "allow"
cognitive_complexity = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints]
workspace = true

[features]
# Headless capture and fixture helpers for the dependent crates' tests. Never on in a release build.
test-support = []

[dependencies]
bcdec_rs = "0.2.0"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_commonmark = { version = "0.25.0", default-features = false }
egui-phosphor = { version = "0.14.0", features = ["light"] }
directories = "6.0.0"
fs2 = "0.4.3"
flate2 = "1.1.10"
hex = "0.4.3"
lewton = "0.10.2"
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
sundial-account = { path = "crates/sundial-account" }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "fallible_uint"] }
tiger-pkg = { version = "0.21.0", features = ["ignore_caches"] }
ww2ogg = "0.1.0"
time = { version = "0.3.55", features = ["formatting"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1.1.5", features = ["fs", "param", "process"] }
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30.13", default-features = false }

[profile.release]
strip = true
lto = "thin"

# Full debug info produces a half-gigabyte PDB for each test binary on Windows, and writing it
# dominates the edit-and-test cycle. Line tables still resolve panic backtraces and test failure
# locations. Set `debug = true` here when a debugging session needs variable inspection.
[profile.dev]
debug = "line-tables-only"

# Dependencies only; workspace crates keep opt-level 0 so their rebuilds stay fast. This is built
# once and then cached, and it covers the bundled SQLite amalgamation, hashing, image decoding and
# zip work that the persistence and package tests spend most of their time inside.
[profile.dev.package."*"]
opt-level = 2
