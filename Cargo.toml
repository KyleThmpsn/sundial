[package]
name = "sundial"
version = "0.3.4"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A local Project Sunrise character and loadout settings editor"
repository = "https://github.com/kylethmpsn/sundial"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
directories = "6.0.0"
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15.4"
tiger-pkg = "0.21.0"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.10.9"
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
strip = true
lto = "thin"
