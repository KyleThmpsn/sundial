[package]
name = "sundial"
version = "0.3.3"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A local Project Sunrise character and loadout settings editor"
repository = "https://github.com/kylethmpsn/sundial"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"
serde_json = { version = "1.0.140", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15.4"
tiger-pkg = "0.21.0"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
strip = true
lto = "thin"
