[package]
name = "sundial-suite"
version.workspace = true
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Sundial desktop application with Parhelion package authoring"
publish = false

[[bin]]
name = "sundial"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["sqlite-account"]
# Official Sunrise investment database support.
sqlite-account = ["sundial/sqlite-account", "parhelion/sqlite-account"]

[dependencies]
parhelion = { path = "../parhelion", default-features = false }
sundial = { path = "../..", default-features = false }

[build-dependencies]
winresource = "0.1.31"
