[package]
name = "parhelion-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Local diagnostic examples are ignored scratch programs, not workspace targets.
autoexamples = false

[dependencies]
sundial = { path = "../.." }
image = { version = "0.25.10", default-features = false, features = ["png"] }
base64 = "0.23.1"
bcdec_rs = "0.2.0"
hex = "0.4"
half = "2.7.1"
png = "0.18"
tiger-pkg = { version = "0.21.0", features = ["ignore_caches"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sha1 = "0.11.0"
libloading = "0.8.9"
fs2 = "0.4.3"
flate2 = "1"
tempfile = "3"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
cc = "1.6.0"
sha2 = "0.11.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader"] }

[lints]
workspace = true
