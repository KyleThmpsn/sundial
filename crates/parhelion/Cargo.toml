[package]
name = "parhelion"
version.workspace = true
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Parhelion investment package authoring for Sundial"
readme = "README.md"
publish = false
autobins = false
autoexamples = false

[lints]
workspace = true

[dependencies]
fs2 = "0.4.3"
base64 = "0.23.1"
egui = { version = "0.31.1", features = ["accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
sha2 = "0.10.9"
sundial = { path = "../..", default-features = false }
tempfile = "3.20.0"
tiger-pkg = { version = "0.21.0", features = ["ignore_caches"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8.9"
