name: Quality

on:
  pull_request:
  push:
    branches: [main, upstream]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default 1.88.0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            desktop-file-utils \
            python3-gi

      - name: Test Linux desktop installation
        run: sh packaging/linux/tests/install.sh

      # Downloaded crate sources only. These are content addressed, so a restored entry can
      # never be stale, and both jobs otherwise refetch the whole dependency graph every run.
      - name: Cache downloaded crates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-crates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-crates-

      # The auditor is pinned to one version, so it is compiled once and reused. Its own root
      # keeps it clear of the rustup shims that live in ~/.cargo/bin.
      - name: Cache dependency auditor
        id: dependency-auditor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install dependency auditor
        if: steps.dependency-auditor.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked --root ~/.cargo-audit

      - name: Put the dependency auditor on PATH
        run: echo "$HOME/.cargo-audit/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Sundial and Parhelion Across All Targets
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

      - name: Test Sundial and Parhelion
        run: cargo test --release --workspace --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --release --workspace --no-deps --locked --lib

      # Narrow Linux accessibility XML exceptions. Any other RustSec vulnerability
      # still fails this check.
      - name: Audit dependencies
        run: cargo audit --deny yanked --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.88
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --no-self-update
          rustup default 1.88.0

      - name: Cache downloaded crates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-crates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-crates-

      - name: Lint Sundial and Parhelion Windows targets
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

      - name: Check Upstream D2 Model Importer
        if: github.ref_name == 'upstream' || github.head_ref == 'upstream'
        run: cargo check --release --locked -p sundial-suite --features d2-model-importer

      - name: Test Sundial and Parhelion on Windows
        run: cargo test --release --workspace --locked
