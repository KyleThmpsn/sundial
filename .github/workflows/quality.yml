name: Quality

on:
  pull_request:
  push:
    branches: [main, upstream]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04

    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default 1.99.0

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            desktop-file-utils \
            python3-gi

      - name: Test Linux Desktop Installation
        run: sh packaging/linux/tests/install.sh

      # Cache compiled dependencies as well as downloaded crates. Release uses the
      # same key, with toolchain, manifests and compiler settings checked by rust-cache.
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ runner.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upstream' }}

      # The auditor is pinned to one version, so it is compiled once and reused. Its own root
      # keeps it clear of the rustup shims that live in ~/.cargo/bin.
      - name: Cache Dependency Auditor
        id: dependency-auditor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install Dependency Auditor
        if: steps.dependency-auditor.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked --root ~/.cargo-audit

      - name: Put the Dependency Auditor on PATH
        run: echo "$HOME/.cargo-audit/bin" >> "$GITHUB_PATH"

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint Sundial and Parhelion across All Targets
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

      # Each integration test file links the whole program, and most hold only opt-in tests that
      # need private game data. The lint step compiles every target, so the test steps build the
      # unit tests and only the integration tests with synthetic cases.
      - name: Test Sundial and Parhelion
        run: |
          rm -f target/cargo-timings/cargo-timing.html
          cargo test --release --workspace --locked --timings --lib --bins
          cargo test --release --workspace --exclude parhelion --locked --test animation_clip --test d1_roi

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --release --workspace --no-deps --locked --lib

      # Any RustSec vulnerability or yanked crate fails this check.
      - name: Audit Dependencies
        run: cargo audit --deny yanked

      - name: Upload Build Timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-quality-${{ runner.os }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-2022

    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --no-self-update
          rustup default 1.99.0

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ runner.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upstream' }}

      # Linux covers the release configuration. Windows builds once with the importer, which
      # releases leave out, so its integration code and synthetic tests run on every change.
      # Tests that need private game data stay ignored here.
      - name: Lint Sundial and Parhelion with the D2 Model Importer
        run: cargo clippy --release --workspace --all-targets --locked --features sundial-suite/d2-model-importer -- -D warnings

      - name: Test Sundial and Parhelion with the D2 Model Importer
        run: |
          Remove-Item -LiteralPath target/cargo-timings/cargo-timing.html -ErrorAction SilentlyContinue
          cargo test --release --workspace --locked --timings --features sundial-suite/d2-model-importer --lib --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --workspace --exclude parhelion --locked --features sundial-suite/d2-model-importer --test animation_clip --test d1_roi

      - name: Upload Build Timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-quality-${{ runner.os }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14
