name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          [[ "$(head -n 1 RELEASE_NOTES.md)" == "Sundial v$version "* ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s does not match Cargo version %s.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Require Quality For This Commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow quality.yml --commit "$commit" --limit 20 \
            --json databaseId,event \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "No Quality run exists for $commit. Run Quality on this ref, then rerun Release." >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 30
          result=$(gh run view "$run_id" --json headSha,conclusion --jq '.headSha + " " + .conclusion')
          test "$result" = "$commit success"

  windows:
    needs: validate-version
    runs-on: windows-2022

    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.88
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - name: Build Sundial
        run: cargo build --release --locked -p sundial-suite

      - name: Generate dependency notices
        shell: pwsh
        run: ./packaging/generate-third-party-notices.ps1 -Target x86_64-pc-windows-msvc

      - name: Package release
        shell: pwsh
        run: ./packaging/package-windows.ps1 -Version "${{ needs.validate-version.outputs.version }}"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sundial-windows-x86_64
          path: dist/*
          if-no-files-found: error

  linux:
    needs: validate-version
    runs-on: ubuntu-22.04

    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Build Sundial
        run: cargo build --release --locked -p sundial-suite

      - name: Generate dependency notices
        shell: pwsh
        run: ./packaging/generate-third-party-notices.ps1 -Target x86_64-unknown-linux-gnu

      - name: Package release
        run: bash ./packaging/package-linux.sh "${{ needs.validate-version.outputs.version }}"

      - name: Verify compatibility baseline
        run: |
          file target/release/sundial
          dependencies=$(ldd target/release/sundial)
          printf '%s\n' "$dependencies"
          if grep -q 'not found' <<< "$dependencies"; then
            echo 'Release binary has unresolved shared libraries' >&2
            exit 1
          fi
          max_glibc=$(readelf --version-info target/release/sundial \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 1)
          echo "Maximum required glibc symbol: $max_glibc"
          test -n "$max_glibc"
          dpkg --compare-versions "${max_glibc#GLIBC_}" le 2.35

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sundial-linux-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate-version, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Sundial-*
          path: dist
          merge-multiple: true

      - name: Verify complete release set
        shell: bash
        run: |
          version="${{ needs.validate-version.outputs.version }}"
          expected=(
            "Sundial-v$version-windows-x86_64.zip"
            "Sundial-v$version-windows-x86_64.zip.sha256"
            "Sundial-v$version-linux-x86_64.tar.gz"
            "Sundial-v$version-linux-x86_64.tar.gz.sha256"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          cd dist
          tr -d '\r' < "Sundial-v$version-windows-x86_64.zip.sha256" | sha256sum --check --strict
          tr -d '\r' < "Sundial-v$version-linux-x86_64.tar.gz.sha256" | sha256sum --check --strict

      - name: Prepare standalone Windows executable
        shell: bash
        run: |
          version="${{ needs.validate-version.outputs.version }}"
          unzip -p "dist/Sundial-v$version-windows-x86_64.zip" \
            "Sundial-v$version-windows-x86_64/sundial.exe" > dist/sundial.exe
          test -s dist/sundial.exe

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/sundial.exe \
            "dist/Sundial-$GITHUB_REF_NAME-windows-x86_64.zip" \
            "dist/Sundial-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            --draft --verify-tag --notes-file RELEASE_NOTES.md --title "Sundial $GITHUB_REF_NAME"

      - name: Verify In-App Update Assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          metadata="$RUNNER_TEMP/sundial-release.json"
          release_id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq '.databaseId')
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"
          python3 - "$metadata" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          release = json.loads(Path(sys.argv[1]).read_text())
          tag = os.environ["GITHUB_REF_NAME"]
          if (release["tag_name"] != tag or release["draft"] is not True
                  or release["prerelease"] is not False or not (release["body"] or "").strip()):
              sys.exit("Expected a stable draft with matching release notes and tag")
          for platform in ("windows-x86_64.zip", "linux-x86_64.tar.gz"):
              name = f"Sundial-{tag}-{platform}"
              archive = Path("dist") / name
              size = archive.stat().st_size
              expected = {
                  "state": "uploaded",
                  "size": size,
                  "digest": "sha256:" + hashlib.sha256(archive.read_bytes()).hexdigest(),
              }
              assets = [asset for asset in release["assets"] if asset["name"] == name]
              if (not 0 < size <= 256 * 1024 * 1024 or len(assets) != 1
                      or any(assets[0].get(key) != value for key, value in expected.items())):
                  sys.exit(f"Release asset does not meet the updater contract: {name}")
              print(f"Verified {name}")
          PY

      - name: Publish Verified Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
